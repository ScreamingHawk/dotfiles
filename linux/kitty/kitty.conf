include current-theme.conf
tab_bar_style separator
tab_separator " "
tab_title_template "{fmt.fg._ffb6c1}┇{fmt.fg.tab} {title} "
active_tab_title_template "{fmt.fg._ffb6c1}┇{fmt.fg.tab} {title} "
font_size 8.0
disable_ligatures never
font_features FiraCode-* +liga +calt
font_family      family='Fira Code' postscript_name=FiraCode-Regular
bold_font        auto
italic_font      auto
bold_italic_font auto
map shift+enter send_text all \x1b[13;2u
map ctrl+f3 detach_window new-tab
map ctrl+f4 detach_tab ask
allow_remote_control yes
listen_on unix:/tmp/kitty
restore_session_after_logout yes
startup_session ~/.config/kitty/restore.session
map f5 save_as_session --use-foreground-process --save-only ~/.config/kitty/restore.session
enabled_layouts fat
watcher focus-to-top.py
map alt+shift+left move_window left
map alt+shift+right move_window right
map alt+shift+up move_window top
map alt+shift+down move_window bottom
